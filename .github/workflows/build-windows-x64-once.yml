name: Build Windows x64 Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows-x64-once.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build frontend and type check
        shell: bash
        run: |
          npx tsc
          npx vite build

      - name: Build Windows x64 installer
        shell: bash
        run: |
          npx electron-builder --win nsis --x64 --publish never '--config.artifactName=${productName}-${version}-x64-Setup.${ext}'

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: WeFlow-Windows-x64-Setup
          path: release/*-x64-Setup.exe
          if-no-files-found: error
          retention-days: 7
